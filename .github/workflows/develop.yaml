name: Development Builds

on:
  push:
    branches:
      - "main"
  workflow_dispatch:

jobs:
  changes:
    name: Check Code Changes
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      client-binary: ${{ steps.filter.outputs.client-binary }}
      client-image: ${{ steps.filter.outputs.client-image }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect Changed Paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            frontend:
              - 'apps/web/**'
              - 'apps/server/**'
              - 'internal/server/**'
              - 'go.mod'
              - 'go.sum'
              - '.dockerignore'
              - 'deployments/server.Dockerfile'
            client-binary:
              - 'apps/client/**'
            client-image:
              - 'apps/client/**'
              - '.dockerignore'
              - 'deployments/client.Dockerfile'

  build-client-binary:
    name: Build Client Binary
    runs-on: ubuntu-latest
    needs:
      - changes
    if: always() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.client-binary == 'true')
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Golang
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/client/go.mod
          cache-dependency-path: apps/client/go.sum

      - name: Build Client
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          cd apps/client
          go build -ldflags="-s -w -X bird-lg/client/internal/buildinfo.Version=dev -X bird-lg/client/internal/buildinfo.Build=${{ github.sha }}" -o bird-lg-client-linux-${{ matrix.goarch }} .

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: bird-lg-client-linux-${{ matrix.goarch }}
          path: apps/client/bird-lg-client-*

  docker-images:
    name: Build Docker Images
    needs:
      - changes
    if: always() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.client-image == 'true')
    uses: ./.github/workflows/docker-images.yaml
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    with:
      ghcr_frontend_image: realsunyz/bird-lg
      ghcr_client_image: realsunyz/bird-lg-client
      frontend_tags: |
        dev
        dev-${{ github.sha }}
      client_tags: |
        dev
        dev-${{ github.sha }}
      frontend_primary_tag: dev
      client_primary_tag: dev
      build_frontend: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true' }}
      build_client: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.client-image == 'true' }}
      app_version: dev
      app_build: ${{ github.sha }}
      attest_best_effort: true
