name: Release Builds

on:
  release:
    types: [created]

jobs:
  build-client-binary:
    name: Build Client Binary
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Golang
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/client/go.mod
          cache-dependency-path: apps/client/go.sum

      - name: Build Client
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          cd apps/client
          go build -ldflags="-s -w -X bird-lg/client/internal/buildinfo.Version=${{ github.event.release.tag_name }} -X bird-lg/client/internal/buildinfo.Build=${{ github.sha }}" -o bird-lg-client-linux-${{ matrix.goarch }} .

      - name: Upload Client Binary
        uses: softprops/action-gh-release@v2
        with:
          files: apps/client/bird-lg-client-*

  docker-images:
    name: Build Docker Images
    uses: ./.github/workflows/docker-images.yaml
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    with:
      ghcr_frontend_image: realsunyz/bird-lg
      ghcr_client_image: realsunyz/bird-lg-client
      vultr_registry: sjc.vultrcr.com
      vultr_frontend_image: seven/bird-lg
      vultr_client_image: seven/bird-lg-client
      frontend_tags: |
        latest
        ${{ github.event.release.tag_name }}
      client_tags: |
        latest
        ${{ github.event.release.tag_name }}
      frontend_primary_tag: latest
      client_primary_tag: latest
      app_version: ${{ github.event.release.tag_name }}
      app_build: ${{ github.sha }}
      attest_best_effort: false
    secrets:
      vultr_username: ${{ secrets.VULTR_USERNAME }}
      vultr_password: ${{ secrets.VULTR_PASSWORD }}
