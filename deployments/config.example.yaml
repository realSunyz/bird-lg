# BIRD Looking Glass Server Configuration
# Environment variables override these settings

# Server listen address
listen: ":3000"

# Static files directory
# Override this when serving assets from another path.
static_dir: "./static"

# Cloudflare Turnstile configuration
# Leave empty to disable CAPTCHA verification
turnstile:
  site_key: ""
  secret_key: ""

# JWT configuration for session tokens
jwt:
  secret: "" # Set in production! Tokens expire in 5 minutes

# HMAC secret for signing requests to client nodes
hmac:
  secret: ""

# Optional Logto SSO configuration.
# When both fields are set, BIRD queries require SSO login.
logto:
  endpoint: ""
  app_id: ""

# Server nodes configuration
# Each server connects to a client instance
servers:
  - id: hkg
    name:
      en: Hong Kong
      zh: 香港
    descr:
      en: Hong Kong, China
      zh: 香港特别行政区, 中国
    endpoint: http://hkg.example.com:12345
    icon: HK

